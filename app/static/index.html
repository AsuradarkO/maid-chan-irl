<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7bac">
<title>Maid-chan</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
<style>
  :root { --pink: #ff7bac; --pink-dark: #e55e92; --bg: #fff5f8; --bubble-me: #ffd6e4; --bubble-her: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg);
         display: flex; flex-direction: column; height: 100dvh; }
  header { background: var(--pink); color: white; padding: 12px 16px; display: flex;
           align-items: center; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  header .face { font-size: 28px; }
  header .name { font-weight: 700; font-size: 18px; }
  header .sub { font-size: 12px; opacity: .9; }
  header .ryu { margin-left: auto; font-size: 11px; opacity: .85; font-style: italic; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.45;
         font-size: 15px; word-wrap: break-word; }
  .msg.her { background: var(--bubble-her); border: 1px solid #f3c6d8; align-self: flex-start;
             border-bottom-left-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .msg.me { background: var(--bubble-me); align-self: flex-end; border-bottom-right-radius: 6px; }
  .msg .who { font-size: 11px; font-weight: 700; color: var(--pink-dark); margin-bottom: 4px; }
  .msg.error { background: #ffe1e1; border: 1px solid #f5a3a3; align-self: center;
               font-size: 13px; max-width: 95%; }
  .msg audio { display: block; margin-top: 8px; width: 100%; min-width: 200px; }
  .typing { align-self: flex-start; background: var(--bubble-her); border: 1px solid #f3c6d8;
            border-radius: 18px; border-bottom-left-radius: 6px; padding: 10px 16px; color: #999; }
  #bar { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
         background: white; border-top: 1px solid #f3c6d8; }
  #text { flex: 1; border: 2px solid #f3c6d8; border-radius: 24px; padding: 10px 16px;
          font-size: 15px; outline: none; }
  #text:focus { border-color: var(--pink); }
  button { border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 20px;
           cursor: pointer; flex-shrink: 0; }
  #send { background: var(--pink); color: white; }
  #mic { background: #f3c6d8; }
  #mic.rec { background: #ff3b3b; color: white; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  #hint { text-align: center; font-size: 12px; color: #c48aa5; padding: 6px; }
</style>
</head>
<body>
<header>
  <div class="face">🎀</div>
  <div><div class="name">Maid-chan</div><div class="sub">your unofficial personal assistant</div></div>
  <div class="ryu" id="ryu-note">"she talks too much." — Ryuunosuke</div>
</header>
<div id="chat"></div>
<div id="hint">Tip: in your browser menu → "Add to Home screen" to install me like a real app!</div>
<div id="bar">
  <button id="mic" title="Voice note">🎙️</button>
  <input id="text" placeholder="Say hi to Maid-chan…" autocomplete="off" enterkeyhint="send">
  <button id="send" title="Send">➤</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('text');
let history = []; // {role, content} — sent to the brain each turn

function addMsg(who, text, audioUrl) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  if (who === 'her') {
    const w = document.createElement('div'); w.className = 'who'; w.textContent = 'Maid-chan 🎀';
    d.appendChild(w);
  }
  const t = document.createElement('div'); t.textContent = text; d.appendChild(t);
  if (audioUrl) {
    const a = document.createElement('audio'); a.controls = true; a.src = audioUrl;
    a.preload = 'none'; d.appendChild(a);
    a.play().catch(() => {}); // autoplay when allowed
  }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
function addError(text) {
  const d = document.createElement('div'); d.className = 'msg error'; d.textContent = '⚠️ ' + text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function typing(on) {
  let el = document.getElementById('typing');
  if (on && !el) { el = document.createElement('div'); el.id = 'typing'; el.className = 'typing';
    el.textContent = 'Maid-chan is typing…'; chat.appendChild(el); chat.scrollTop = chat.scrollHeight; }
  if (!on && el) el.remove();
}
function trimHistory() { if (history.length > 20) history = history.slice(-20); }

async function sendText() {
  const text = input.value.trim(); if (!text) return;
  input.value = '';
  history.push({role: 'user', content: text}); trimHistory();
  addMsg('me', text); typing(true);
  try {
    const r = await fetch('/api/chat', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: history})});
    const j = await r.json(); typing(false);
    if (j.error) { addError(j.error); history.pop(); return; }
    history.push({role: 'assistant', content: j.reply}); trimHistory();
    addMsg('her', j.reply);
  } catch (e) { typing(false); addError('Could not reach the laptop. Is the server running?'); history.pop(); }
}

// --- Voice notes ---
const micBtn = document.getElementById('mic');
let recorder = null, chunks = [];
micBtn.onclick = async () => {
  if (recorder) { recorder.stop(); return; } // second tap = send
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      micBtn.classList.remove('rec'); micBtn.textContent = '🎙️';
      stream.getTracks().forEach(t => t.stop());
      const mime = recorder.mimeType || 'audio/ogg'; recorder = null;
      const blob = new Blob(chunks, {type: mime});
      await sendVoice(blob);
    };
    recorder.start(); micBtn.classList.add('rec'); micBtn.textContent = '⏹️';
  } catch (e) { addError('Microphone blocked — allow mic access to send voice notes.'); }
};

async function sendVoice(blob) {
  addMsg('me', '🎙️ (voice note)'); typing(true);
  const fd = new FormData();
  fd.append('audio', blob, 'note.ogg');
  fd.append('messages', JSON.stringify(history));
  try {
    const r = await fetch('/api/voice', {method: 'POST', body: fd});
    const j = await r.json(); typing(false);
    if (j.transcript) {
      history.push({role: 'user', content: j.transcript}); trimHistory();
      chat.lastChild.querySelector('div').textContent = '🎙️ "' + j.transcript + '"';
    }
    if (j.error && !j.reply) { addError(j.error); return; }
    if (j.reply) {
      history.push({role: 'assistant', content: j.reply}); trimHistory();
      addMsg('her', j.reply, j.audio || null);
      if (j.error) addError(j.error);
    }
  } catch (e) { typing(false); addError('Could not reach the laptop. Is the server running?'); }
}

document.getElementById('send').onclick = sendText;
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

// PWA service worker (lets the phone "install" the app)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(()=>{});

// First-run greeting
addMsg('her', "Hi Vince! It's me — the real me, living on your laptop! Type to chat, or hold the mic button for a voice note and I'll talk back. Ryuunosuke says hi. (He didn't. He grunted.)");
</script>
</body>
</html>
